name: Update news ticker

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-ticker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest Washington Sun headlines
        run: python3 .github/scripts/update_ticker.py
      - name: Commit if headlines changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update news ticker headlines"
          git push
